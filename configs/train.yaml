model:
  num_node_types: 3
  num_edge_types: 2
  hidden_dim: 256
  embed_dim: 256
  output_dim: 1
  n_layers: 6
  n_heads: 8
  dropout: 0.1
  attention_dropout: 0.1
  activation_dropout: 0.1
  drop_path_rate: 0.0
  use_performer: true
  performer_nb_features: 64
  performer_generalized_attention: true
  layernorm_style: prenorm
  tokenizer_lap_dim: 16
  tokenizer_lap_dropout: 0.2
  tokenizer_n_layers: 6
  phyla_dim: 256

trainer:
  record: True
  epochs: 10000
  val_callback_frequency: 10
  checkpoint_dir: checkpoints/
  phyla_checkpoint_path: checkpoints/chkpts/epoch%3D00-step%3D004000-treefam_avg_normrf%3D0.6721.ckpt
  lr: 0.0001
  steps_callback: 100
  val_callback_freq: 0


data:
  # nexus_root: /n/netscratch/mzitnik_lab/Lab/yektefaie/phylaflow_datasets/nexus
  # mrbayes_root: /n/netscratch/mzitnik_lab/Lab/yektefaie/runs
  # nexus_root: /home/leo/PhylaFlow/example_data/nexus/
  # mrbayes_root: /home/leo/PhylaFlow/example_data/runs/
  nexus_root: ./example_data/nexus/
  mrbayes_root: ./example_data/runs/
  batch_size: 16
  num_workers: 0
  pin_memory: False
  sanity_check: True
